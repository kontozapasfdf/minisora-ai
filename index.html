<style>
body {

<body>

<h1>🎬 MiniSora AI</h1>
<p>Twórz niesamowite filmy AI!</p>

<div class="box">
<h2>✨ Opisz swój film</h2>

<textarea id="prompt" placeholder="Opisz swój film..."></textarea>

<button onclick="generate()">🚀 STWÓRZ FILM</button>

<p id="status"></p>

<button onclick="window.open('https://wan2.video/','_blank')">
🎥 OTWÓRZ GENERATOR AI
</button>
</div>

<p>MiniSora AI © 2026</p>

<script>
function generate() {
const prompt = document.getElementById("prompt").value;
if(!prompt.trim()) {
alert("Najpierw opisz swój film!");
return;
}
navigator.clipboard.writeText(prompt).then(() => {
document.getElementById("status").innerText =
"✅ Skopiowano opis! Wklej go w generatorze AI.";
}).catch(() => {
document.getElementById("status").innerText =
"Skopiuj opis ręcznie.";
});
}
</script>

</body>
</html>
